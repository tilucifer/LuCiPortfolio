<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuCiPortfolio</title>
  <style>
    :root {
      --ink: #18243a;
      --muted: #7e899b;
      --line: #e8edf3;
      --paper: #ffffff;
      --canvas: #f5f7fa;
      --navy: #172943;
      --navy-soft: #243b5b;
      --blue: #4779ed;
      --blue-soft: #edf3ff;
      --mint: #e9f7f0;
      --green: #287a57;
      --amber: #fff4dc;
      --shadow: 0 12px 36px rgba(26, 43, 69, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 244px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 27px 17px 20px; display: flex; flex-direction: column; color: #e9f0fa; background: var(--navy); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 33px; }
    .brand-mark { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 13px; color: #fff; background: linear-gradient(145deg, #88aaff, #4b79ef); font-family: Georgia, serif; font-size: 22px; font-weight: 700; box-shadow: 0 7px 18px rgba(59, 105, 221, .32); }
    .brand-name { font-size: 17px; letter-spacing: -.6px; font-weight: 700; }
    .brand-sub { margin-top: 1px; color: #91a2bb; font-size: 10px; letter-spacing: 1.45px; text-transform: uppercase; }
    .nav-label { padding: 0 12px 10px; color: #8092ac; font-size: 10px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 10px; color: #b3c1d3; background: transparent; text-align: left; transition: .18s ease; }
    .nav-item:hover { color: white; background: rgba(255,255,255,.07); }
    .nav-item.active { color: #fff; background: #2c4467; box-shadow: inset 3px 0 #82a5ff; }
    .nav-icon { width: 19px; text-align: center; font-size: 16px; }
    .sidebar-bottom { margin-top: auto; padding: 15px 11px 3px; border-top: 1px solid rgba(255,255,255,.1); color: #92a4bc; font-size: 11px; }
    .sidebar-bottom strong { display: block; margin-bottom: 4px; color: #dce6f4; font-size: 12px; }
    .workspace { min-width: 0; padding: 0 42px 54px; }
    .topbar { height: 78px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e9edf3; }
    .crumb { color: #8a95a5; font-size: 12px; }
    .crumb strong { color: #394960; font-weight: 600; }
    .profile-chip { display: flex; align-items: center; gap: 9px; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 30px; color: #47556a; background: #fff; font-size: 12px; }
    .profile-avatar { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; color: #3e64bb; background: #e8efff; font-size: 11px; font-weight: 700; }
    .page { max-width: 1420px; margin: 0 auto; padding-top: 32px; }
    .eyebrow { margin: 0 0 7px; color: #8491a4; font-size: 10px; font-weight: 700; letter-spacing: 1.55px; text-transform: uppercase; }
    h1 { margin: 0; color: #1b2940; font-size: clamp(25px, 3vw, 32px); line-height: 1.17; letter-spacing: -1.05px; }
    .page-intro { margin: 9px 0 0; color: #7d8999; font-size: 13px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .heading-actions { display: flex; gap: 9px; }
    .button { min-height: 39px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 1px solid transparent; border-radius: 9px; color: white; background: var(--blue); box-shadow: 0 4px 10px rgba(71,121,237,.18); font-size: 12px; font-weight: 650; transition: .15s ease; }
    .button:hover { transform: translateY(-1px); background: #396be0; }
    .button.secondary { color: #526174; border-color: #dfe6ee; background: #fff; box-shadow: none; }
    .button.secondary:hover { background: #f9fbfd; }
    .button.small { min-height: 32px; padding: 0 11px; font-size: 11px; }
    .button.ghost { min-height: 30px; padding: 0 9px; color: #607088; background: transparent; box-shadow: none; }
    .button.ghost:hover { color: #315fc0; background: var(--blue-soft); }
    .button:disabled { cursor: wait; opacity: .65; transform: none; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 23px; }
    .stat-card { position: relative; min-height: 131px; padding: 21px 22px; overflow: hidden; border: 1px solid #edf0f4; border-radius: 13px; background: var(--paper); box-shadow: 0 4px 15px rgba(34,51,75,.025); }
    .stat-label { color: #758297; font-size: 12px; font-weight: 550; }
    .stat-value { margin-top: 10px; font-size: 31px; line-height: 1; letter-spacing: -1.4px; font-weight: 700; }
    .stat-foot { margin-top: 10px; color: #9aa4b1; font-size: 11px; }
    .stat-icon { position: absolute; top: 20px; right: 21px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: #4e78db; background: #eff4ff; font-size: 16px; }
    .stat-card:nth-child(2) .stat-icon { color: #2c8d65; background: #e9f7f0; }
    .stat-card:nth-child(3) .stat-icon { color: #ad7c24; background: #fff5df; }
    .home-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .8fr); gap: 17px; }
    .panel { border: 1px solid #e9edf2; border-radius: 13px; background: #fff; box-shadow: 0 4px 16px rgba(34,51,75,.025); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 19px 21px; border-bottom: 1px solid #eff2f5; }
    .panel-title { margin: 0; font-size: 14px; font-weight: 700; }
    .panel-subtitle { margin-top: 3px; color: #8995a5; font-size: 11px; }
    .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; padding: 18px 20px 20px; }
    .quick-action { display: flex; align-items: center; gap: 12px; min-height: 65px; padding: 11px; border: 1px solid #edf0f4; border-radius: 10px; color: inherit; background: #fff; text-align: left; transition: .15s; }
    .quick-action:hover { border-color: #cad8fb; background: #fafcff; transform: translateY(-1px); }
    .quick-icon { width: 35px; height: 35px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; color: #4d77db; background: #eff4ff; font-size: 15px; }
    .quick-title { display: block; font-size: 12px; font-weight: 650; }
    .quick-caption { display: block; margin-top: 2px; color: #8995a5; font-size: 10px; }
    .recent-list { padding: 3px 20px 13px; }
    .recent-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f0f2f5; }
    .recent-item:last-child { border-bottom: 0; }
    .recent-avatar { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; color: #526caa; background: #edf2ff; font-size: 10px; font-weight: 700; }
    .recent-name { font-size: 11px; font-weight: 650; }
    .recent-meta { margin-top: 2px; color: #8995a5; font-size: 10px; }
    .empty-state { padding: 24px; color: #929eae; font-size: 12px; text-align: center; }
    .filter-panel { padding: 15px; margin-bottom: 14px; }
    .filters { display: grid; grid-template-columns: minmax(190px, 1.65fr) repeat(4, minmax(130px, 1fr)); gap: 9px; }
    .field-wrap { position: relative; min-width: 0; }
    .field-wrap.search:before { content: '⌕'; position: absolute; top: 7px; left: 12px; color: #8e9aae; font-size: 21px; line-height: 1; }
    .control, .select-control, .textarea-control { width: 100%; min-height: 38px; padding: 0 11px; border: 1px solid #e1e7ee; border-radius: 8px; outline: none; color: #36455a; background: #fff; font-size: 11px; transition: .15s; }
    .field-wrap.search .control { padding-left: 34px; }
    .control:focus, .select-control:focus, .textarea-control:focus { border-color: #89a7f3; box-shadow: 0 0 0 3px rgba(71,121,237,.1); }
    .control::placeholder, .textarea-control::placeholder { color: #a0aab7; }
    .selection-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; padding: 10px 13px; border: 1px solid #d9e5ff; border-radius: 9px; color: #4565ac; background: #f2f6ff; font-size: 11px; }
    .selection-bar.visible { display: flex; }
    .selection-actions { display: flex; align-items: center; gap: 8px; }
    .table-panel { overflow: hidden; }
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { padding: 12px 13px; color: #8591a2; background: #fafbfd; text-align: left; font-size: 9px; font-weight: 700; letter-spacing: .65px; text-transform: uppercase; }
    td { padding: 13px; border-top: 1px solid #f0f2f5; color: #59677b; font-size: 11px; }
    tr:hover td { background: #fcfdff; }
    .contact-name { color: #26364d; font-size: 11px; font-weight: 680; }
    .cell-sub { margin-top: 3px; color: #9aa4b2; font-size: 10px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; max-width: 240px; white-space: normal; }
    .tag { display: inline-flex; align-items: center; padding: 3px 7px; border-radius: 20px; color: #5b6a80; background: #f0f3f7; font-size: 9px; }
    .tag.blue { color: #476ac1; background: #edf3ff; }
    .tag.green { color: #348362; background: #ebf7f0; }
    .tag.amber { color: #a4792f; background: #fff5df; }
    .checkbox { width: 15px; height: 15px; accent-color: var(--blue); vertical-align: middle; cursor: pointer; }
    .table-footer { display: flex; justify-content: space-between; gap: 12px; padding: 12px 15px; border-top: 1px solid #eef1f5; color: #96a1af; font-size: 10px; }
    .show-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .show-card { padding: 17px; border: 1px solid #e9edf2; border-radius: 12px; background: white; transition: .16s; }
    .show-card:hover { border-color: #d5def1; box-shadow: 0 6px 22px rgba(33,51,79,.055); transform: translateY(-1px); }
    .show-top { display: flex; justify-content: space-between; gap: 12px; }
    .show-title { margin: 0; color: #28384e; font-size: 13px; font-weight: 700; }
    .show-company { margin-top: 5px; color: #8490a1; font-size: 11px; }
    .show-card .tag { margin-top: 14px; }
    .show-edit { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0f2f5; text-align: right; }
    .show-filters { display: grid; grid-template-columns: minmax(250px, 1fr) 200px; gap: 9px; margin-bottom: 15px; }
    .import-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(270px, .8fr); gap: 17px; align-items: start; }
    .form-panel { padding: 22px; }
    .form-panel h2 { margin: 0; font-size: 15px; }
    .form-panel > p { margin: 6px 0 20px; color: #8490a0; font-size: 11px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-field { min-width: 0; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label, .form-label { display: block; margin-bottom: 6px; color: #536177; font-size: 11px; font-weight: 650; }
    .form-field .control, .form-field .select-control { min-height: 41px; font-size: 12px; }
    .textarea-control { min-height: 84px; padding: 10px 11px; resize: vertical; font-size: 12px; }
    .checkline { display: flex; flex-wrap: wrap; gap: 9px 16px; padding-top: 5px; }
    .check-option { display: flex; align-items: center; gap: 7px; color: #647188; font-size: 11px; }
    .import-aside { padding: 21px; border: 1px solid #e5ebf4; border-radius: 12px; background: linear-gradient(150deg, #f1f5ff, #fff 80%); }
    .aside-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; color: #4772d4; background: #e6edff; font-size: 16px; }
    .import-aside h3 { margin: 14px 0 7px; font-size: 14px; }
    .import-aside p, .import-aside li { color: #77859a; font-size: 11px; line-height: 1.65; }
    .import-aside ul { padding-left: 18px; margin: 8px 0 0; }
    .notice { margin-top: 16px; padding: 11px 12px; border-radius: 8px; color: #5570ac; background: #eaf0ff; font-size: 10px; line-height: 1.6; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(18, 31, 50, .42); backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(760px, 100%); max-height: min(90vh, 850px); overflow: hidden; border-radius: 14px; background: white; box-shadow: 0 24px 80px rgba(11, 25, 44, .25); animation: rise .18s ease-out; }
    .modal.narrow { width: min(440px, 100%); }
    @keyframes rise { from { opacity: .4; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 20px 23px 16px; border-bottom: 1px solid #edf0f4; }
    .modal-header h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; }
    .modal-header p { margin: 4px 0 0; color: #8a95a4; font-size: 11px; }
    .close-button { width: 29px; height: 29px; border: 0; border-radius: 8px; color: #7c8898; background: #f3f5f8; font-size: 18px; line-height: 1; }
    .modal-body { max-height: calc(90vh - 143px); overflow-y: auto; padding: 20px 23px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 23px; border-top: 1px solid #edf0f4; background: #fcfdfe; }
    .save-feedback { display: none; margin: 0 23px 12px; padding: 9px 11px; border-radius: 8px; color: #4569b8; background: #edf3ff; font-size: 11px; overflow-wrap: anywhere; }
    .save-feedback.visible { display: block; }
    .save-feedback.error { color: #96383d; background: #fff0f0; }
    .save-feedback.success { color: #26734f; background: #eaf7f0; }
    .show-pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .picker-box { padding: 12px; border: 1px solid #e8edf2; border-radius: 9px; }
    .picker-title { margin: 0 0 9px; color: #41516a; font-size: 11px; font-weight: 700; }
    .picker-list { display: grid; gap: 6px; max-height: 112px; overflow-y: auto; }
    .picker-empty { color: #a1aab6; font-size: 10px; }
    .modal-divider { grid-column: 1 / -1; height: 1px; margin: 2px 0; background: #edf0f4; }
    .toast { position: fixed; z-index: 30; right: 24px; bottom: 22px; max-width: min(440px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 10px; color: #fff; background: #233d5e; box-shadow: 0 10px 30px rgba(17, 32, 52, .22); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(10px); transition: .22s; }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: #a23d43; }
    .loading { padding: 70px 20px; color: #8490a2; text-align: center; }
    .loading-dot { display: inline-block; width: 8px; height: 8px; margin: 0 2px; border-radius: 50%; background: #7294ec; animation: pulse 1s infinite alternate; }
    .loading-dot:nth-child(2) { animation-delay: .2s; }.loading-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { to { opacity: .25; transform: scale(.7); } }
    @media (max-width: 1050px) {
      .workspace { padding-right: 25px; padding-left: 25px; }
      .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .show-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 740px) {
      .app-shell { display: block; }
      .sidebar { position: relative; width: 100%; height: auto; padding: 12px 14px; }
      .brand { padding: 0 4px 11px; }
      .brand-mark { width: 32px; height: 32px; font-size: 18px; }
      .brand-name { font-size: 15px; }
      .brand-sub, .nav-label, .sidebar-bottom { display: none; }
      .nav-list { display: flex; overflow-x: auto; gap: 4px; }
      .nav-item { width: auto; flex: 0 0 auto; padding: 8px 10px; font-size: 11px; }
      .nav-item.active { box-shadow: inset 0 -2px #82a5ff; }
      .nav-icon { font-size: 13px; }
      .workspace { padding: 0 16px 35px; }
      .topbar { height: 54px; }
      .profile-chip { padding-right: 6px; }.profile-chip span:last-child { display: none; }
      .page { padding-top: 25px; }
      .page-heading { align-items: flex-start; flex-direction: column; margin-bottom: 19px; }
      .heading-actions { width: 100%; }.heading-actions .button { flex: 1; }
      .stat-grid { gap: 8px; }.stat-card { min-height: 112px; padding: 15px; }.stat-icon { top: 13px; right: 13px; width: 30px; height: 30px; }.stat-label { max-width: 72px; font-size: 10px; }.stat-value { font-size: 26px; }.stat-foot { font-size: 9px; }
      .home-grid, .import-layout { grid-template-columns: 1fr; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters .field-wrap.search { grid-column: 1 / -1; }
      .show-filters { grid-template-columns: 1fr; }
      .show-grid { grid-template-columns: 1fr; }
      .quick-grid { grid-template-columns: 1fr 1fr; padding: 13px; }
      .quick-action { padding: 9px; }.quick-icon { width: 30px; height: 30px; }
      .form-grid { grid-template-columns: 1fr; }.form-field.full { grid-column: auto; }
      .show-pickers { grid-template-columns: 1fr; }
      .selection-bar { align-items: flex-start; flex-direction: column; }
      .selection-actions { width: 100%; }.selection-actions .button { flex: 1; }
      .modal-backdrop { padding: 10px; }.modal-header { padding: 17px 17px 13px; }.modal-body { padding: 16px 17px; }.modal-footer { padding: 11px 17px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div><div class="brand-name">LuCiPortfolio</div><div class="brand-sub">Carnet de programmation</div></div>
      </div>
      <div class="nav-label">Espace de travail</div>
      <nav class="nav-list" aria-label="Navigation principale">
        <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span>Accueil</button>
        <button class="nav-item" data-page="contacts"><span class="nav-icon">♙</span>Contacts</button>
        <button class="nav-item" data-page="spectacles"><span class="nav-icon">✳</span>Spectacles</button>
        <button class="nav-item" data-page="import"><span class="nav-icon">↥</span>Importer</button>
      </nav>
      <div class="sidebar-bottom"><strong>Votre réseau culturel</strong>Contacts, programmations et spectacles réunis au même endroit.</div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="crumb">LuCiPortfolio <span aria-hidden="true"> / </span> <strong id="crumb-current">Accueil</strong></div>
        <div class="profile-chip"><div class="profile-avatar">LC</div><span>Mon espace</span></div>
      </header>
      <div id="main-content" class="page"><div class="loading">Chargement des données <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
    </main>
  </div>
  <div id="modal-root" class="modal-backdrop" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const state = { page: 'home', setupRequired: false, contacts: [], spectacles: [], contactQuery: '', department: '', audience: '', contactShow: '', showQuery: '', showCategory: '', selected: new Set() };
    const PAGE_NAMES = { home: 'Accueil', contacts: 'Contacts', spectacles: 'Spectacles', import: 'Importer' };
    const main = document.getElementById('main-content');
    const modalRoot = document.getElementById('modal-root');
    let toastTimer;

    document.querySelectorAll('.nav-item').forEach(button => button.addEventListener('click', () => navigate(button.dataset.page)));
    main.addEventListener('click', handleMainClick);
    main.addEventListener('input', handleMainInput);
    main.addEventListener('change', handleMainChange);
    main.addEventListener('submit', handleMainSubmit);
    modalRoot.addEventListener('click', handleModalClick);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    document.addEventListener('submit', event => {
      if (['setup-form', 'import-form', 'contact-form', 'show-form', 'email-form'].includes(event.target.id)) event.preventDefault();
    }, true);

    function callServer(method, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))))[method](...args);
      });
    }

    async function loadData() {
      try {
        const data = await callServer('getAppData');
        state.setupRequired = Boolean(data.setupRequired);
        state.contacts = data.contacts || [];
        state.spectacles = data.spectacles || [];
        render();
        return true;
      } catch (error) {
        main.innerHTML = `<div class="panel empty-state"><strong>Impossible de charger les données</strong><br>${escapeHtml(error.message)}<br><br>Vérifiez que le projet Apps Script est lié au Google Sheet.</div>`;
        return false;
      }
    }

    function navigate(page) {
      state.page = page;
      document.querySelectorAll('.nav-item').forEach(button => button.classList.toggle('active', button.dataset.page === page));
      document.getElementById('crumb-current').textContent = PAGE_NAMES[page] || 'Accueil';
      render();
    }

    function render() {
      if (state.setupRequired) { renderSetup(); return; }
      if (state.page === 'contacts') renderContacts();
      else if (state.page === 'spectacles') renderSpectacles();
      else if (state.page === 'import') renderImport();
      else renderHome();
    }

    function renderSetup() {

    function filteredContacts() {
      const q = state.contactQuery.toLocaleLowerCase('fr').trim();
      return state.contacts.filter(contact => {
        const shows = [...(contact.spectaclesVus || []), ...(contact.spectaclesProgrammes || [])];
        const haystack = [fullName(contact), contact.email, contact.company, contact.ville, contact.departement, contact.telephone, contact.commentaires, showNames(shows)].join(' ').toLocaleLowerCase('fr');
        if (q && !haystack.includes(q)) return false;
        if (state.department && contact.departement !== state.department) return false;
        if (state.audience === 'jeune' && !contact.jeunePublic) return false;
        if (state.audience === 'adulte' && !contact.adulte) return false;
        if (state.audience === 'rue' && !contact.rue) return false;
        if (state.contactShow && !shows.includes(state.contactShow)) return false;
        return true;
      }).sort((a, b) => {
        const sort = document.getElementById('contact-sort')?.value;
        if (sort === 'ville') return (a.ville || '').localeCompare(b.ville || '', 'fr');
        if (sort === 'company') return (a.company || '').localeCompare(b.company || '', 'fr');
        return fullName(a).localeCompare(fullName(b), 'fr');
      });
    }

    function bindModalSubmit(formId) {
      const form = document.getElementById(formId);
      if (form) form.addEventListener('submit', handleModalSubmit);
    }

    function bindModalSaveButton(formId, action) {
      const button = document.querySelector(`#${formId} [data-action="${action}"]`);
      if (button) button.addEventListener('click', () => submitModalForm(formId));
    }

    function closeModal() { modalRoot.classList.remove('open'); modalRoot.innerHTML = ''; }

    async function handleMainClick(event) {
      const pageButton = event.target.closest('[data-page]');
      if (pageButton && !pageButton.classList.contains('nav-item')) { navigate(pageButton.dataset.page); return; }
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'new-contact') openContactModal();
      if (action === 'edit-contact') { const contact = state.contacts.find(item => item.id === button.dataset.id); if (contact) openContactModal(contact); }
      if (action === 'new-show') openShowModal();
      if (action === 'edit-show') { const show = state.spectacles.find(item => item.id === button.dataset.id); if (show) openShowModal(show); }
      if (action === 'email-list') openEmailModal();
      if (action === 'clear-selection') { state.selected.clear(); renderContactRows(); }
    }

    function submitModalForm(formId) {
      const form = document.getElementById(formId);
      if (!form) return;
      if (typeof form.reportValidity === 'function' && !form.reportValidity()) {
        notify('Vérifie les champs obligatoires avant d’enregistrer.', true);
        return;
      }
      if (typeof form.reportValidity !== 'function' && !form.checkValidity()) {
        notify('Vérifie les champs obligatoires avant d’enregistrer.', true);
        return;
      }
      handleModalSubmit({ target: form, preventDefault: function () {} });
    }

    function handleMainInput(event) {
      if (event.target.id === 'contact-search') { state.contactQuery = event.target.value; renderContactRows(); }
      if (event.target.id === 'show-search') { state.showQuery = event.target.value; document.getElementById('show-results').innerHTML = showCards(filteredShows()); }
    }

    function handleMainChange(event) {
      const target = event.target;
      if (target.id === 'department-filter') state.department = target.value;
      if (target.id === 'audience-filter') state.audience = target.value;
      if (target.id === 'contact-show-filter') state.contactShow = target.value;
      if (target.id === 'contact-sort') { renderContactRows(); return; }
      if (target.id === 'show-category') state.showCategory = target.value;
      if (target.id === 'show-category' || target.id === 'show-search') { const results = document.getElementById('show-results'); if (results) results.innerHTML = showCards(filteredShows()); return; }
      if (target.dataset.contactCheck) {
        if (target.checked) state.selected.add(target.dataset.contactCheck); else state.selected.delete(target.dataset.contactCheck);
      }
      if (target.dataset.action === 'select-visible') {
        filteredContacts().forEach(contact => target.checked ? state.selected.add(contact.id) : state.selected.delete(contact.id));
      }
      renderContactRows();
    }

    async function handleMainSubmit(event) {
      if (!['setup-form', 'import-form'].includes(event.target.id)) return;
      event.preventDefault();
      const form = event.target;
      const values = new FormData(form);
      const button = form.querySelector('button[type="submit"]');
      const isSetup = form.id === 'setup-form';
      setBusy(button, true, isSetup ? 'Connexion…' : 'Import en cours…');
      try {
        if (isSetup) {
          const result = await callServer('connectSpreadsheet', values.get('spreadsheetId'));
          await loadData();
          notify(`Google Sheet « ${result.name} » connecté.`);
          return;
        }
        const spreadsheetId = extractSpreadsheetId(values.get('spreadsheetId'));
        const result = await callServer('importContacts', { spreadsheetId, sheetName: values.get('sheetName'), hasHeader: values.has('hasHeader'), showMode: values.get('showMode') });
        await loadData();
        notify(`${result.count} contact(s) importé(s) · ${result.shows} spectacle(s) ajouté(s).`);
      } catch (error) { notify(error.message, true); }
      finally { if (button) { button.disabled = false; button.textContent = isSetup ? 'Connecter le fichier' : '↥ Importer les contacts'; } }
    }

    async function handleModalSubmit(event) {
      const form = event.target;
      const elementId = form.getAttribute("id")
      if (!['contact-form', 'show-form', 'email-form'].includes(elementId)) return;
      event.preventDefault();
      const button = form.querySelector('button[type="submit"], button[data-action^="save-"]');
      setBusy(button, true, 'Enregistrement…');
      setSaveFeedback(form, 'Enregistrement dans le Google Sheet…');
      try {
        const values = new FormData(form);
        if (elementId === 'contact-form') {
          const contact = {
            id: values.get('id'), civilite: values.get('civilite'), prenom: values.get('prenom'), nom: values.get('nom'), email: values.get('email'),
            telephone: values.get('telephone'), ville: values.get('ville'), departement: values.get('departement'), company: values.get('company'),
            commentaires: values.get('commentaires'), note: values.get('note'), jeunePublic: values.has('jeunePublic'), adulte: values.has('adulte'), rue: values.has('rue'),
            spectaclesVus: [...form.querySelectorAll('[data-show-seen]:checked')].map(input => input.dataset.showSeen),
            spectaclesProgrammes: [...form.querySelectorAll('[data-show-programmed]:checked')].map(input => input.dataset.showProgrammed)
          };
          await callServer('saveContact', contact);
          button.textContent = 'Actualisation…';
          setSaveFeedback(form, 'Enregistrement effectué. Actualisation de la liste…', 'success');
          const refreshed = await loadData();
          closeModal();
          notify(refreshed ? 'La fiche contact a été enregistrée et la liste actualisée.' : 'La fiche est enregistrée, mais la liste n’a pas pu être actualisée. Rechargez la page.', !refreshed);
        }
        if (elementId === 'show-form') {
          await callServer('saveSpectacle', { id: values.get('id'), nom: values.get('nom'), compagnie: values.get('compagnie'), categorie: values.get('categorie'), commentaires: values.get('commentaires') });
          button.textContent = 'Actualisation…';
          setSaveFeedback(form, 'Enregistrement effectué. Actualisation de la liste…', 'success');
          const refreshed = await loadData();
          closeModal();
          notify(refreshed ? 'La fiche spectacle a été enregistrée et la liste actualisée.' : 'La fiche est enregistrée, mais la liste n’a pas pu être actualisée. Rechargez la page.', !refreshed);
        }
        if (elementId === 'email-form') {
          const result = await callServer('createEmailList', [...state.selected], values.get('listName'));
          closeModal(); state.selected.clear(); render(); notify(`${result.count} email(s) ajoutés à « ${result.listName} ».`);
        }
      } catch (error) {
        setSaveFeedback(form, error.message || String(error), 'error');
        notify(error.message || String(error), true);
        if (button) { button.disabled = false; button.textContent = 'Réessayer'; }
      }
    }

    function handleModalClick(event) {
      if (event.target === modalRoot || event.target.closest('[data-action="close-modal"]')) { closeModal(); return; }
    }

    function notify(message, error = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message; toast.classList.toggle('error', error); toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 3900);
    }

    function setSaveFeedback(form, message, kind = '') {
      const element = form.querySelector('[data-save-feedback]');
      if (!element) return;
      element.textContent = message;
      element.className = `save-feedback visible${kind ? ` ${kind}` : ''}`;
    }

    function setBusy(button, busy, label) { if (!button) return; if (busy) { button.dataset.previous = button.textContent; button.disabled = true; button.textContent = label; } else { button.disabled = false; button.textContent = button.dataset.previous || label; } }
    function fullName(contact) { return [contact.civilite, contact.prenom, contact.nom].filter(Boolean).join(' ').trim(); }
    function initials(contact) { return `${(contact.prenom || contact.nom || 'C').charAt(0)}${(contact.nom || '').charAt(0)}`.toLocaleUpperCase('fr'); }
    function showName(id) { const show = state.spectacles.find(item => item.id === id); return show ? show.nom : 'Spectacle'; }
    function showNames(ids) { return ids.map(showName).join(' '); }
    function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
    function escapeAttr(value) { return escapeHtml(value); }
    function extractSpreadsheetId(value) { const input = String(value || '').trim(); const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/); return match ? match[1] : input; }

    loadData();
  </script>
</body>
</html>
